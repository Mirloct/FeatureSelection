# =============================================================================
# config.yaml - FUENTE UNICA DE VERDAD del pipeline de feature selection
# Data sources / inputs: dataset indicado en entradas.ruta_dataset.
# Created: 2026-07-26
# Last modified: 2026-10-04
# Changelog:
# - 2026-10-04: se retiro el feature engineering temporal/KDE y la
#   estandarizacion de puestos (implementados en el codigo base de entrada).
# - 2026-10-04: documenta resolucion Monte Carlo con correccion +1.
# - 2026-10-02: listas contiguas para conservar sin analizar o excluir totalmente.
# - 2026-10-02: exclusiones manuales conservadas al final del dataset exportado.
# - 2026-10-02: unica fuente de valores; config.py conserva tipos y validacion.

# A. ENTRADAS OBLIGATORIAS
entradas:
  # INGRESE AQUI la ruta y los nombres exactos de id, tiempo y target.
  ruta_dataset: "data/panel_sintetico.csv"
  columna_target: "target"          # <- cambie aqui el nombre de su target
  columna_id: "id_entidad"          # <- identificador de entidad del panel
  columna_tiempo: "periodo"         # <- dimension temporal del panel
  usar_boruta: true
  ruta_salida_excel: "outputs/bitacora_feature_selection.xlsx"

  columnas_conservadas: []          # conservar al final, sin analizar
  columnas_excluidas: []           # retirar antes del analisis; no exportar

  exportar_dataset_final: true
  ruta_dataset_final: ""            # "" -> se deriva junto a ruta_salida_excel
  formato_dataset_final: "csv"      # "csv" | "parquet"

# B. FASE 1 - UNIVARIADO
univariado:
  umbral_ceros_nulos: 0.95          # criterio principal (95%)
  umbral_ceros_nulos_alterno: 0.90  # criterio conservador alterno (90%)
  usar_umbral_alterno: false        # true -> aplica el umbral de 90%

  umbral_std_minimo: 0.00000001     # 1e-8  -> practicamente constante
  umbral_cv_minimo: 0.0001          # 1e-4  -> dispersion relativa despreciable
  umbral_dominancia: 0.99           # una sola categoria cubre >=99% de la muestra
  umbral_iqr_minimo: 0.0            # IQR <= 0 -> percentiles comprimidos
  minimo_valores_unicos: 2

  umbral_dominancia_aviso: 0.90     # categorica con clase mayoritaria en [90%, 99%) -> aviso
  umbral_alta_cardinalidad: 20      # categorica con mas de 20 niveles -> aviso (one-hot no recomendable)

# B2. FASE 1B - AGRUPACION DE CATEGORICAS DE CARDINALIDAD MUY ALTA POR NOMBRE
agrupacion_categorica:
  usar_agrupacion_categorica_nombre: true
  umbral_cardinalidad_clustering: 100   # activa el clustering (no solo el aviso) por encima de esto
  max_k_agrupacion_categorica: 30       # tope del barrido de k explorado por silueta

# C. FASE 2 - BIVARIADO (Information Value y Gini)
bivariado:
  n_bins: 10                        # bins objetivo por cuantiles para WOE/IV
  min_prop_bin: 0.03                # >=3% de la muestra por bin (estabilidad del WOE)
  max_categorias: 50                # cardinalidad maxima; el resto va a "OTROS"
  correccion_woe: 0.5               # correccion de Haldane-Anscombe (evita log(0))

  peso_gini: 0.50                   # ponderacion balanceada por defecto
  peso_iv: 0.50
  metodo_normalizacion: "minmax"    # "minmax" | "rank"

  umbral_iv_minimo: 0.02            # IV < 0.02  -> sin poder predictivo (Siddiqi)
  umbral_gini_minimo: 0.05          # Gini < 0.05 -> discriminacion despreciable
  umbral_score_minimo: 0.0          # piso sobre el score compuesto (0 = inactivo)

  usar_piso_ruido: true
  alpha_ruido: 0.01                 # significancia del contraste contra el azar
  bonferroni_ruido: false           # true -> corrige por n de variables evaluadas
  umbral_iv_sospechoso: 0.60        # IV > 0.60 -> posible fuga de informacion
  excluir_sospecha_fuga: true       # true -> ademas de marcar, elimina
  top_n_bivariado: 0                # >0 -> conserva solo las N mejores

  umbral_psi: 0.25                  # estabilidad temporal (especifico de panel)
  excluir_por_inestabilidad: false

# C2. FASE 2 ALTERNATIVA - RELEVANCIA NO SUPERVISADA (fallback sin target)
no_supervisado:
  laplacian_k_vecinos: 10           # vecinos del grafo k-NN (He, Cai y Niyogi, 2005)
  laplacian_max_filas: 20000        # submuestreo del grafo (0 = sin limite)
  laplacian_n_permutaciones: 200    # p minimo = 1/(n+1); 200 -> 1/201
  alpha_ruido_laplaciano: 0.05      # significancia del contraste contra el azar
  bonferroni_ruido_laplaciano: false # true -> corrige por n de variables evaluadas
  peso_laplaciano: 0.50             # ponderacion balanceada por defecto
  peso_dispersion: 0.50
  top_n_no_supervisado: 0           # >0 -> conserva solo las N mejores

# D. FASE 3 - MULTIVARIADO
multivariado:
  umbral_correlacion: 0.90          # |asociacion| > 0.90 -> redundancia
  metodo_correlacion: "spearman"    # "spearman" (robusto) | "pearson"
  umbral_vif: 10.0                  # VIF > 10 -> multicolinealidad severa
  excluir_por_vif: false            # por defecto informativo, no eliminatorio

# E. FASE 4 - BORUTA (opcional)
boruta:
  motor_boruta: "auto"              # auto | borutapy | borutashap | nativo
  boruta_n_estimadores: 200
  boruta_max_iter: 60
  boruta_alpha: 0.05                # nivel de significancia del test binomial
  boruta_profundidad_max: 6
  boruta_max_filas: 100000          # submuestreo para acotar costo (0 = sin limite)

# F. EJECUCION
ejecucion:
  semilla: 42                       # reproducibilidad
  n_jobs: -1
  autoinstalar_dependencias: true
  ruta_log: "outputs/featsel.log"
  nivel_log: "INFO"                 # DEBUG | INFO | WARNING | ERROR
  csv_sep: ","
  csv_encoding: "utf-8"
  csv_encodings_fallback: ["utf-8-sig", "cp1252", "latin1"] # solo ante error de decoding
  generar_demo_si_falta: true       # genera demo solo si falta el dataset y la carpeta esta vacia
